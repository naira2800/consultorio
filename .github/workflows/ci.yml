name: CI

# Corre las pruebas en cada push y en cada pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Pruebas (Node + MySQL)
    runs-on: ubuntu-latest

    # Base de datos MySQL 8 efimera para las pruebas de integracion.
    # Coincide con la configuracion de docker-compose.yml (root sin contrasena).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: consultorio
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: consultorio
      APP_SECRET: clave-solo-para-ci

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Inicializar la base (esquema + datos de ejemplo)
        run: npm run db:init -- --seed

      - name: Ejecutar pruebas
        run: npm test
